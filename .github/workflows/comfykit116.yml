name: Build ComfyKit 1.16.5

on:
  push:
    paths: ['comfykit-1.16.5/**', '.github/workflows/comfykit116.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build mod
        working-directory: comfykit-1.16.5
        run: gradle build --no-daemon --console=plain --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ComfyKit-1.16.5-JAR
          path: |
            comfykit-1.16.5/build/libs/comfykit-*.jar
            !comfykit-1.16.5/build/libs/*-dev.jar
          if-no-files-found: error
