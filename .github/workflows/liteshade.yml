name: Build LiteShade

on:
  push:
    paths: ['liteshade/**', '.github/workflows/liteshade.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build mod
        working-directory: liteshade
        run: gradle build --no-daemon --console=plain --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LiteShade-JAR
          path: |
            liteshade/build/libs/liteshade-*.jar
            !liteshade/build/libs/*-dev.jar
          if-no-files-found: error
