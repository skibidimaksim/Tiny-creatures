name: Build Wild Kingdom

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle build --no-daemon --console=plain --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WildKingdom-JAR
          path: build/libs/*.jar
          if-no-files-found: error
