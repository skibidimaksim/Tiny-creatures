name: Build Wild Kingdom

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle build --no-daemon --console=plain --stacktrace
      - name: Inspect GeckoLib API
        continue-on-error: true
        run: |
          J=$(find ~/.gradle -name 'geckolib-neoforge-1.21.11*.jar' ! -name '*sources*' | head -1)
          for c in software.bernie.geckolib.animatable.SingletonGeoAnimatable software.bernie.geckolib.animatable.GeoAnimatable 'software.bernie.geckolib.renderer.GeoArmorRenderer$ArmorSegment' 'software.bernie.geckolib.renderer.GeoArmorRenderer$RenderData' software.bernie.geckolib.model.DefaultedGeoModel; do echo "=== $c"; javap -p -constants -cp "$J" "$c" || true; done
          unzip -l "$J" | grep -i "mixin" | head -20
          mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$J" 'META-INF/*' 'geckolib*.json' 2>/dev/null; ls /tmp/x; find ~/.gradle -name '*geckolib*sources*' | head
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WildKingdom-JAR
          path: build/libs/*.jar
          if-no-files-found: error
