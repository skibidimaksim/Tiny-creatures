plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.wildkingdom'
base { archivesName = 'wild-kingdom' }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('software.bernie.geckolib') }
    }
}

neoForge {
    version = '21.11.45'
    runs {
        client { client() }
        server { server() }
    }
    mods { wildkingdom { sourceSet sourceSets.main } }
}

dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.11:5.4.3'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
