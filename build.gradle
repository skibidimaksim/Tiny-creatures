plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.+' }
version = '1.0.0'
group = 'com.cursedstudios.tinycreatures'
base { archivesName = 'tinycreatures' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.+'; runs { client { client() }; server { server() } }; mods { tinycreatures { sourceSet sourceSets.main } } }
repositories { mavenCentral() }
tasks.withType(ProcessResources).configureEach { filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version) } }
